name: Veraphify public verification

on:
  push:
    branches: [main, fix/product-vault-boundary]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  product:
    name: Product checkout and brand verification
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Verify the product starts with no Vault checkout
        shell: bash
        run: |
          if git cat-file -e HEAD:test-vault 2>/dev/null; then
            echo "The test-vault workspace belongs in Lydite-Test-Vault"
            exit 1
          fi
          node veraphifiy.mjs --help
      - name: Verify the Veraphify brand records and approval checks
        run: |
          python -B brand-identity/verify.py --ready-for-artwork
          python -B -m unittest discover -s brand-identity -v

  vault:
    name: Branch-owned Vault
    uses: vixttha/Veraphify/.github/workflows/test-vault.yml@9cd93f72ab18655758585ccbb047e69fbfec1d13
    with:
      product_sha: ${{ github.sha }}
      vault_sha: 9cd93f72ab18655758585ccbb047e69fbfec1d13
